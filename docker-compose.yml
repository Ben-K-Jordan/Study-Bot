# Local PostgreSQL for development. The app itself runs on the host with
# `npm run dev` (or `npm run build && npm start`).
services:
  db:
    # The official postgres:16 image plus the pgvector extension, which
    # prisma/manual-scripts/001_pgvector.sql needs for embedding search.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-studybot}
    ports:
      # Host port 5433 avoids clashing with a locally installed Postgres on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
